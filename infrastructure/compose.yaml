services:
  postgres:
    image: postgres:16-alpine
    container_name: webverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webverse
      POSTGRES_USER: webverse
      POSTGRES_PASSWORD: webverse_dev
    ports:
      - "5432:5432"
    volumes:
      - webverse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webverse -d webverse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: webverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - webverse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  webverse-postgres-data:
  webverse-redis-data:
